<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌面时钟 · Desk Clock</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" data-tauri-drag-region data-style="flip" data-backdrop="none">
  <div id="clock" class="clock"></div>

  <button id="gear" type="button" title="设置" aria-label="设置">&#9881;</button>

  <div id="settings" class="settings" hidden>
    <div class="settings-head">
      <span id="settings-title">设置</span>
      <button id="settings-close" type="button" aria-label="关闭">&times;</button>
    </div>

    <div id="tray-hint" class="tray-hint" hidden data-i18n="trayHint">本程序常驻系统托盘，不在任务栏显示；关闭窗口只会隐藏到托盘，托盘菜单可重新显示或退出。</div>

    <label><span data-i18n="language">界面语言</span>
      <select id="pref-lang">
        <option value="zh-CN">简体中文</option>
        <option value="en">English</option>
      </select>
    </label>

    <label><span data-i18n="style">时钟样式</span>
      <select id="pref-style">
        <option value="flip">翻页卡片</option>
        <option value="minimal">极简细体</option>
        <option value="neon">霓虹</option>
        <option value="eink">电子墨水</option>
        <option value="segment">七段数码</option>
        <option value="typewriter">打字机</option>
        <option value="glass">毛玻璃</option>
        <option value="analog">指针表盘</option>
      </select>
    </label>

    <label><span data-i18n="font">时钟字体</span>
      <select id="pref-font">
        <option value="">跟随样式（推荐）</option>
        <option value="sans">系统无衬线</option>
        <option value="serif">衬线体</option>
        <option value="mono">等宽 / 数码感</option>
        <option value="rounded">圆润黑体</option>
        <option value="__custom__">自定义…</option>
      </select>
    </label>

    <label id="custom-font-row" hidden><span data-i18n="fontCustom">自定义…</span>
      <input id="pref-font-custom" type="text" placeholder="Microsoft YaHei, sans-serif">
    </label>

    <label><span data-i18n="color">时钟颜色</span>
      <select id="pref-color">
        <option value="">跟随样式（推荐）</option>
        <option value="#ffffff">白色</option>
        <option value="#8bfaff">青色</option>
        <option value="#6bff8f">绿色</option>
        <option value="#ffb000">琥珀</option>
        <option value="#ff9ec7">粉色</option>
        <option value="#ff6b6b">红色</option>
        <option value="#191a1c">黑色</option>
        <option value="__custom__">自定义…</option>
      </select>
    </label>

    <label id="custom-color-row" hidden><span data-i18n="colorCustom">自定义…</span>
      <input id="pref-color-custom" type="color" value="#f6f7f9">
    </label>

    <label><span data-i18n="showSeconds">显示秒</span>
      <input id="pref-seconds" type="checkbox">
    </label>

    <label><span data-i18n="hour12">12 小时制</span>
      <input id="pref-hour12" type="checkbox">
    </label>

    <label><span data-i18n="alwaysOnTop">总在最前</span>
      <input id="pref-ontop" type="checkbox">
    </label>

    <label><span data-i18n="autostart">开机自启</span>
      <input id="pref-autostart" type="checkbox">
    </label>

    <label><span data-i18n="backdrop">背景板</span>
      <select id="pref-backdrop">
        <option value="none">无</option>
        <option value="blur">模糊</option>
        <option value="dim">暗色</option>
        <option value="light">浅色</option>
      </select>
    </label>

    <label><span data-i18n="scale">大小</span>
      <input id="pref-scale" type="range" min="0.5" max="2.5" step="0.05" value="1">
    </label>
    <div class="scale-value"><output id="scale-out">100%</output><span data-i18n="resizeTip">拖动右下角也可调整</span></div>

    <label><span data-i18n="opacity">不透明度</span>
      <input id="pref-opacity" type="range" min="0.3" max="1" step="0.05" value="1">
    </label>

    <div class="settings-sep" data-i18n="alarmTitle">闹钟</div>
    <div class="alarm-editor">
      <select id="alarm-hour" aria-label="小时"></select>
      <span class="alarm-colon">:</span>
      <select id="alarm-minute" aria-label="分钟"></select>
      <label class="inline"><input id="alarm-repeat" type="checkbox" checked><span data-i18n="alarmRepeat">每天</span></label>
      <button id="alarm-add" type="button" data-i18n="alarmAdd">添加</button>
    </div>
    <div id="alarm-list" class="alarm-list"></div>

    <div class="settings-sep" data-i18n="shutdownTitle">定时关机</div>
    <div class="shutdown-editor">
      <input id="shutdown-min" type="number" min="1" max="1440" step="1" value="60">
      <span class="unit" data-i18n="minutes">分钟</span>
      <button id="shutdown-start" type="button" data-i18n="shutdownStart">启动</button>
      <button id="shutdown-cancel" type="button" hidden data-i18n="shutdownCancel">取消</button>
    </div>
    <div id="shutdown-status" class="shutdown-status" data-i18n="shutdownOff">未启用</div>
    <div class="shutdown-warn" data-i18n="shutdownWarn">到点将关闭计算机，请先保存工作；可随时取消。</div>

    <div class="settings-sep" data-i18n="permTitle">权限与启动</div>
    <div id="perm-status" class="perm-status" data-i18n="permChecking">正在检查权限…</div>
    <div id="perm-note" class="perm-note"></div>
    <label id="perm-admin-row" class="perm-row" hidden><span data-i18n="permAdmin">始终以管理员身份启动</span>
      <input id="perm-run-admin" type="checkbox">
    </label>
    <div class="perm-note" data-i18n="permAdminNote">勾选后，下次手动启动以及开机自启都会自动向 Windows 请求管理员权限（UAC 提示由系统弹出）；取消勾选即恢复普通权限。</div>
    <button id="perm-elevate-now" class="settings-done perm-btn" type="button" hidden data-i18n="permElevateNow">立即以管理员身份重启</button>
    <button id="perm-quit" class="settings-done perm-btn" type="button" hidden data-i18n="permQuit">退出程序</button>

    <div class="settings-sep" data-i18n="donateTitle">打赏支持</div>
    <div class="donate-note" data-i18n="donateNote">如果这个小工具有帮到你，欢迎请作者喝杯咖啡 ☕（完全自愿）</div>
    <button id="donate-toggle" class="settings-done donate-btn" type="button" data-i18n="donateToggle">查看收款码</button>
    <div id="donate-panel" class="donate-panel" hidden>
      <div class="donate-tabs">
        <button type="button" class="donate-tab active" data-donate="wechat" data-i18n="donateWechat">微信支付</button>
        <button type="button" class="donate-tab" data-donate="alipay" data-i18n="donateAlipay">支付宝</button>
      </div>
      <div class="donate-qr"><img id="donate-img" src="assets/donate-wechat.jpg" alt="收款码"></div>
      <div class="donate-foot" data-i18n="donateFoot">长按 / 截图后扫码 · 感谢你的支持</div>
    </div>

    <button id="reset-defaults" class="settings-done reset" type="button" data-i18n="resetDefaults">一键还原默认（Alt+R）</button>
    <button id="settings-close-2" class="settings-done" type="button" data-i18n="close">关闭</button>
  </div>

  <div id="resize-handle" title="拖动调整大小" aria-label="拖动调整大小"></div>

  <div id="alarm-toast" class="alarm-toast" hidden>
    <div class="alarm-toast-head"><span data-i18n="alarmRinging">⏰ 闹钟</span>
      <button id="alarm-toast-close" type="button" aria-label="关闭">&times;</button></div>
    <div id="alarm-toast-body" class="alarm-toast-body"></div>
    <div class="alarm-toast-actions">
      <button id="alarm-snooze" type="button" data-i18n="alarmSnooze">稍后提醒（5 分钟）</button>
      <button id="alarm-dismiss" type="button" data-i18n="alarmDismiss">知道了</button>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="prefs.js"></script>
<script src="fonts.js"></script>
<script src="alarm.js"></script>
<script src="flip.js"></script>
<script src="clock.js"></script>
<script src="app.js"></script>
</body>
</html>
