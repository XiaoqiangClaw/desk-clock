<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desk Clock</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" data-tauri-drag-region data-style="flip" data-backdrop="none">
  <div id="clock" class="clock"></div>

  <button id="gear" type="button" title="Settings" aria-label="Settings">&#9881;</button>

  <div id="settings" class="settings" hidden>
    <div class="settings-head">
      <span>Desk Clock</span>
      <button id="settings-close" type="button" aria-label="Close">&times;</button>
    </div>

    <label>Style
      <select id="pref-style">
        <option value="flip">flip</option>
        <option value="minimal">minimal</option>
        <option value="neon">neon</option>
        <option value="eink">eink</option>
        <option value="segment">segment</option>
        <option value="typewriter">typewriter</option>
        <option value="glass">glass</option>
        <option value="analog">analog</option>
      </select>
    </label>

    <label>Show seconds
      <input id="pref-seconds" type="checkbox">
    </label>

    <label>12-hour
      <input id="pref-hour12" type="checkbox">
    </label>

    <label>Always on top
      <input id="pref-ontop" type="checkbox">
    </label>

    <label>Autostart
      <input id="pref-autostart" type="checkbox">
    </label>

    <label>Backdrop
      <select id="pref-backdrop">
        <option value="none">none</option>
        <option value="blur">blur</option>
        <option value="dim">dim</option>
        <option value="light">light</option>
      </select>
    </label>

    <label>Scale
      <input id="pref-scale" type="range" min="0.5" max="2.5" step="0.05" value="1">
    </label>

    <label>Opacity
      <input id="pref-opacity" type="range" min="0.3" max="1" step="0.05" value="1">
    </label>

    <button id="settings-close-2" class="settings-done" type="button">Close</button>
  </div>
</div>

<script src="prefs.js"></script>
<script src="flip.js"></script>
<script src="clock.js"></script>
<script src="app.js"></script>
</body>
</html>
