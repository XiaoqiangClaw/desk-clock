name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Publish ${{ matrix.platform }} ${{ matrix.args }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # 与 build.yml 共用同一脚本：预置 WiX/NSIS，避开 GitHub Release 临时 504。
      - name: Preinstall WiX/NSIS tooling
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/prepare-windows-tools.ps1

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install Tauri CLI (cargo, no npm frontend)
        run: cargo install tauri-cli --version '^2.0.0' --locked

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "."
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Desk Clock ${{ github.ref_name }} 🕐"
          releaseBody: |
            ## 🕐 Desk Clock v0.7.1

            好看、好用、还跨平台的开源桌面时钟 —— 透明悬浮在壁纸之上，无边框、无黑底。
            本次新增「一键更新」，并修复手动更新时卡在 NSIS「关闭正在运行的工具」的问题。

            ### 🆕 新增 · 一键更新

            设置 → 关于页「检查更新」发现新版本后，除原来的「下载新版本」（跳转 Releases 页），新增 **「一键更新」** 按钮。

            - **自动选对平台安装包**：前端从 GitHub Releases 资源列表按当前系统挑出对应安装包直链（Windows→`.exe` / macOS→`.dmg` / Linux→`.AppImage` 或 `.deb`），不用在多个文件里找。
            - **点击即退出当前时钟**：点「一键更新」后，先打开安装包直链（浏览器开始下载），再主动退出当前时钟进程。用户运行新安装包时本进程已不在，可**避开旧版 NSIS「关闭正在运行的工具」卡死**。
            - **零新依赖、零新权限**：下载直链仅放行本项目 Releases 直链，不引入 Tauri shell 插件或 TLS 依赖。

            ### 🛠️ 修复 · 手动更新卡在「关闭正在运行的工具」

            反馈：手动更新选「关闭正在运行的工具」，卡在 NSIS `Uninstallation Aborted` / `Failed to kill Desk Clock`。

            - 根因：v0.6.3 的 `hooks.nsh` 用 `FindProcessCurrentUser`/`KillProcessCurrentUser`，需取进程 SID 判断「是否当前用户」；当安装器与时钟不在同一完整性级别（如时钟被「以管理员身份启动」）时取不到 SID，误判「无进程」而跳过退出+强杀，随后 RestartManager 关闭请求被程序拦下（关窗只隐藏到托盘），`RmShutdown` 失败、卸载中止。
            - 修复：`hooks.nsh` 改用**不限用户/完整性级别**的 `FindProcess`/`KillProcess`（仅按进程名），保留单实例优雅退出、等约 3 秒后强杀并重试 3 轮。

            > 边界：升级时执行的是旧版本自带卸载器。本修复对「装上 v0.7.1 之后的所有升级」生效；从 v0.7.0 升级时旧卸载器仍可能卡——升级前先从托盘点「退出」再装即可（进程不在就不触发 kill）。

            ### 📌 本版仍包含 v0.7.0 的能力

            - 🔊 **语音报时**（默认关闭，可选声音与规则、中英文、免打扰）
            - 🚀 **Windows 开机自启修复**（官方 Builder 链注册 + 写入后回读校验 + 前端如实反馈失败）

            ### 📥 下载与安装

            | 平台 | 文件 |
            |---|---|
            | 🪟 Windows | `*.msi` 或 `*-setup.exe` |
            | 🍎 macOS Intel | `*x64.dmg` |
            | 🍎 macOS Apple Silicon | `*aarch64.dmg` |
            | 🐧 Debian / Ubuntu | `*.deb` |
            | 🐧 Fedora / RHEL | `*.rpm` |
            | 🐧 通用 Linux | `*.AppImage` |

            > ⚠️ 安装包未做代码签名：macOS 首次打开需右键→打开，Windows 可能弹 SmartScreen 点「仍要运行」。
            > 旧版本覆盖安装即可，配置（含窗口清单与位置）自动保留、自动迁移。

            ### ✅ 验证

            原有 10 套回归全部通过，合计 **420 项**（含 `verify_v063.py` 33 项），无回归。

            完整版本记录见 [CHANGELOG.md](https://github.com/xiaoqiangclub/desk-clock/blob/main/CHANGELOG.md) · 项目介绍见 [README.md](https://github.com/xiaoqiangclub/desk-clock/blob/main/README.md) · 协议 MIT。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
