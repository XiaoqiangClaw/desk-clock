name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # v0.7.5: 发版前跑与 build.yml 同等的静态门禁，避免只改 release 流程时绕过检查。
  verify:
    name: Verify (static)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static checks
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/verify*.py scripts/gen-calendar.py
          bash -n scripts/dev.sh scripts/build.sh scripts/preview.sh
          for f in ui/*.js; do node --check "$f"; done
          python3 -c "import json; json.load(open('src-tauri/tauri.conf.json')); json.load(open('src-tauri/capabilities/default.json')); json.load(open('ui/calendar-data.json'))"
          echo "Static checks OK"

  publish:
    name: Publish ${{ matrix.platform }} ${{ matrix.args }}
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # v0.7.5 发版纪律：每个版本都把「当前最新」的日历数据直接打进安装包。
      # 此时升级 chinese_calendar 到最新版并重跑生成器（自动探测新年份），
      # 因此即使距离上次数据提交已过去很久，本版内置数据也一定是发版时刻最新的。
      - name: Setup Python (for fresh built-in calendar data)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh built-in calendar data to latest
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade chinese_calendar
          python scripts/gen-calendar.py
          node --check ui/calendar-data.js
          python - <<'PY'
          import json, re
          js = open('ui/calendar-data.js', encoding='utf-8').read()
          a = json.loads(re.search(r'CalendarData = (\{.*\});', js, re.S).group(1))
          b = json.load(open('ui/calendar-data.json', encoding='utf-8'))
          assert a == b, '.js and .json must be identical'
          ys = sorted(int(y) for y in a['years'])
          assert ys == list(range(ys[0], ys[-1] + 1)), 'coverage must be contiguous'
          print('fresh built-in calendar coverage:', a['coverage'])
          PY

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # 与 build.yml 共用同一脚本：预置 WiX/NSIS，避开 GitHub Release 临时 504。
      - name: Preinstall WiX/NSIS tooling
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/prepare-windows-tools.ps1

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install Tauri CLI (cargo, no npm frontend)
        run: cargo install tauri-cli --version '^2.0.0' --locked

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "."
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Desk Clock ${{ github.ref_name }} 🕐"
          releaseBody: |
            ## 🕐 Desk Clock v0.7.5

            好看、好用、还跨平台的开源桌面时钟 —— 透明悬浮在壁纸之上，无边框、无黑底。
            本次把日历数据同步从「按时间盲轮询」升级为**覆盖驱动**，并做到**每个版本都内置当前最新的日历数据**。

            ### 🎯 改进 · 覆盖驱动：平时零联网，临期才更新

            日历数据按年整块覆盖（国务院每年 11 月上旬发次年放假安排），所以不需要反复检查：

            - **覆盖内 → 纯本地、零联网**：当前年份落在数据覆盖内就完全不联网，一年只真正需要更新一次。
            - **临期预取**：覆盖末年的 **12 月起**才后台预取次年，阈值晚于国务院发文，拉必有所得、不空转。
            - **跨年 / 过期 → 立即自愈**：哪怕整个 12 月没开机，跨年后也会立即拉取，双保险不会错过。
            - **缓存丢失/损坏 → 内置表兜底 + 联网恢复**，功能不受影响。
            - A股交易日、工作日、周末、法定节假日四种规则共用同一份数据，一更新全更新（交易日为「工作日/节假日」派生结果，非独立数据集）。

            ### 🛡️ 新增 · 备用数据源自动容错

            主源为本仓库自托管的 GitHub raw 静态 JSON；新增由主 URL 派生的 **jsDelivr CDN 镜像**（同一仓库同一文件、CORS `*`）。主源故障（超时/HTTP 错误/网络不可达）自动切备源，双源都失败才静默回落到缓存或内置表。仍是零新依赖、零新权限、非第三方 API。

            ### 📦 发版纪律 · 每个版本都内置当前最新数据

            发布流程在打包前强制升级 `chinese_calendar` 并重新生成日历数据（自动探测新年份）、校验一致性后再打进安装包 —— **装上就是发版时刻最新的数据**。运行时同步只用于已装旧版本兜底。CI 定时保鲜任务也降频为「11 月发布季每周 + 其余每月」，贴合一年一发的节奏。

            ### 📌 本版仍包含此前全部能力

            - 📅 **灵活闹钟重复规则**（v0.7.2）：每天 / 工作日（含调休）/ 周末 / 法定节假日 / A股交易日 / 自定义 / 一次性
            - 🔄 **日历数据自动更新**（v0.7.3）：构建期 CI 自动补齐新年份 + 运行时静默热更新，严格校验 + 只增不减防回退
            - 🔊 **语音报时**（默认关闭，可选声音与规则、中英文、免打扰）
            - 🚀 **Windows 开机自启修复**、🆕 **一键更新** + 🛠️ **NSIS 更新卡死修复**
            - 🔗「项目与更新」链接直指 `releases/latest`

            ### 📥 下载与安装

            | 平台 | 文件 |
            |---|---|
            | 🪟 Windows | `*.msi` 或 `*-setup.exe` |
            | 🍎 macOS Intel | `*x64.dmg` |
            | 🍎 macOS Apple Silicon | `*aarch64.dmg` |
            | 🐧 Debian / Ubuntu | `*.deb` |
            | 🐧 Fedora / RHEL | `*.rpm` |
            | 🐧 通用 Linux | `*.AppImage` |

            > ⚠️ 安装包未做代码签名：macOS 首次打开需右键→打开，Windows 可能弹 SmartScreen 点「仍要运行」。
            > 旧版本覆盖安装即可，配置（含窗口清单与位置）自动保留、自动迁移。覆盖安装后仍可关闭旧进程手工退出以避开旧卸载器边界。

            ### ✅ 验证

            全套 12 套回归全部通过，合计 **575 项**；`verify_calendar_sync.py` 扩至 138 项（覆盖驱动 8 个日期场景、主源故障切备源、双源失败、缓存恢复、发版刷新纪律、CI 降频均实测，Node 行为测试真实加载模块），无回归。

            完整版本记录见 [CHANGELOG.md](https://github.com/xiaoqiangclub/desk-clock/blob/main/CHANGELOG.md) · 项目介绍见 [README.md](https://github.com/xiaoqiangclub/desk-clock/blob/main/README.md) · 协议 MIT。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
