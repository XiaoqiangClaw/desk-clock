name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # v0.7.5: 发版前跑与 build.yml 同等的静态门禁，避免只改 release 流程时绕过检查。
  verify:
    name: Verify (static)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static checks
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/verify*.py scripts/gen-calendar.py
          bash -n scripts/dev.sh scripts/build.sh scripts/preview.sh
          for f in ui/*.js; do node --check "$f"; done
          python3 -c "import json; json.load(open('src-tauri/tauri.conf.json')); json.load(open('src-tauri/capabilities/default.json')); json.load(open('ui/calendar-data.json'))"
          echo "Static checks OK"

  publish:
    name: Publish ${{ matrix.platform }} ${{ matrix.args }}
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # v0.7.5 发版纪律：每个版本都把「当前最新」的日历数据直接打进安装包。
      # 此时升级 chinese_calendar 到最新版并重跑生成器（自动探测新年份），
      # 因此即使距离上次数据提交已过去很久，本版内置数据也一定是发版时刻最新的。
      - name: Setup Python (for fresh built-in calendar data)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh built-in calendar data to latest
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade chinese_calendar
          python scripts/gen-calendar.py
          node --check ui/calendar-data.js
          python - <<'PY'
          import json, re
          js = open('ui/calendar-data.js', encoding='utf-8').read()
          a = json.loads(re.search(r'CalendarData = (\{.*\});', js, re.S).group(1))
          b = json.load(open('ui/calendar-data.json', encoding='utf-8'))
          assert a == b, '.js and .json must be identical'
          ys = sorted(int(y) for y in a['years'])
          assert ys == list(range(ys[0], ys[-1] + 1)), 'coverage must be contiguous'
          print('fresh built-in calendar coverage:', a['coverage'])
          PY

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # 与 build.yml 共用同一脚本：预置 WiX/NSIS，避开 GitHub Release 临时 504。
      - name: Preinstall WiX/NSIS tooling
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/prepare-windows-tools.ps1

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install Tauri CLI (cargo, no npm frontend)
        run: cargo install tauri-cli --version '^2.0.0' --locked

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "."
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Desk Clock ${{ github.ref_name }} 🕐"
          releaseBody: |
            ## 🕐 Desk Clock v0.7.6

            好看、好用、还跨平台的开源桌面时钟。本版专门修复主人反复反馈的两个问题：**闹钟 / 定时提醒弹窗不显示**、**Windows 开机自启不生效**。

            ### 🔴 提醒弹窗：找到真根因

            Tauri 官方 `WebviewWindowBuilder::build()` 文档明确写着：在**同步命令**中调用会在 Windows WebView2 上与主线程互锁，必须用 async 命令或独立线程。旧版 `show_alert` 正是同步命令里直接建窗——弹窗根本没被创建，IPC 永不返回。前两版改「透明 → 不透明」「尺寸」「超时关窗」都没打中。

            本版改为 **async 命令 + 独立线程建窗**，并加：并发无状态保护（防多个闹钟抢建同名窗口）、显式可见 / 置前 / 聚焦、自动关窗代次化（复用弹窗时旧定时器不再误关新提醒）、**建窗失败时主窗口内页内提醒兜底**（保证看得到内容、能手动停止闹铃）。

            ### 🔴 开机自启：上游路径没加引号

            依赖 `auto-launch 0.6.0` 写 Windows 注册表 `Run` 值时用 `format!("{} {}", app_path, args)`，**没有给 exe 路径加引号**。安装目录含空格（`C:\Program Files\...`）时，系统登录会把它截断成 `C:\Program`，静默不启动；而 `is_enabled()` 只检查值是否存在，界面仍显示「已开启」——正是主人看到的现象。

            本版在启用自启、启动自愈、手动「一键修复」三条路径都改写为**带引号的当前 exe 绝对路径**并回读校验，HKCU / HKLM 双键兼容。

            ### 🩺 新增：开机自启诊断面板

            设置 →「窗口」→ 开机自启下方新增「检测开机自启状态 / 一键修复」，直接列出真实注册表命令、路径是否带引号、是否指向当前程序、是否被任务管理器禁用、是否设了 RUNASADMIN 兼容层，不再靠猜。

            > 若勾选了「始终以管理员身份启动」，Windows 登录阶段 UAC 会拦截自启，请关闭该选项或改用任务计划程序。诊断面板会明确提示这一项。

            ### 📥 下载与安装

            | 平台 | 文件 |
            |---|---|
            | 🪟 Windows | `*.msi` 或 `*-setup.exe` |
            | 🍎 macOS Intel | `*x64.dmg` |
            | 🍎 macOS Apple Silicon | `*aarch64.dmg` |
            | 🐧 Debian / Ubuntu | `*.deb` |
            | 🐧 Fedora / RHEL | `*.rpm` |
            | 🐧 通用 Linux | `*.AppImage` |

            > ⚠️ 安装包未做代码签名：macOS 首次打开需右键→打开，Windows 可能弹 SmartScreen 点「仍要运行」。旧版本覆盖安装即可，配置自动保留。
            > 已装旧版也可在设置页用「一键更新」自动下载安装。

            ### ✅ 验证

            Rust 侧由 GitHub Actions 四平台编译验证；前端全套静态回归通过。注销→重新登录的真机自启验证请用设置页的诊断面板确认系统真值。

            完整版本记录见 [CHANGELOG.md](https://github.com/xiaoqiangclub/desk-clock/blob/main/CHANGELOG.md) · 项目介绍见 [README.md](https://github.com/xiaoqiangclub/desk-clock/blob/main/README.md) · 协议 MIT。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
