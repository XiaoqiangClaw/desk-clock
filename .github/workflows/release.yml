name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Publish ${{ matrix.platform }} ${{ matrix.args }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # 与 build.yml 共用同一脚本：预置 WiX/NSIS，避开 GitHub Release 临时 504。
      - name: Preinstall WiX/NSIS tooling
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/prepare-windows-tools.ps1

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install Tauri CLI (cargo, no npm frontend)
        run: cargo install tauri-cli --version '^2.0.0' --locked

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "."
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Desk Clock ${{ github.ref_name }} 🕐"
          releaseBody: |
            ## 🕐 Desk Clock v0.7.2

            好看、好用、还跨平台的开源桌面时钟 —— 透明悬浮在壁纸之上，无边框、无黑底。
            本次把闹钟「每天重复」单个开关升级为**灵活的重复规则**，并优化「项目与更新」链接。

            ### 📅 新增 · 闹钟重复规则灵活化

            反馈：闹钟时间设置原先只有一个「每天重复」开关，希望可以快速设置工作日、周末、节假日、交易日及自定义。

            - **多模式一键选**：设置 →「闹钟」页添加闹钟时，下拉选 **每天 / 工作日 / 周末 / 法定节假日 / A股交易日 / 自定义 / 一次性**；列表每行显示中英文可读的规则摘要。
            - **工作日含调休**：不是简单周一~周五，而是按中国大陆法定节假日与调休安排——法定假日停休的工作日不算、调休补班的周末算工作日。
            - **法定节假日 / A股交易日**：节假日按国务院放假安排；交易日为周一~周五且非法定节假日（周末含调休补班一律休市）。
            - **自定义**：可勾周几（多选）、添加指定日期、勾选「排除法定节假日」，满足个性化组合。
            - **一次性与旧数据兼容**：旧 `repeat:true`→每天、`false`→一次性（响后移除），跨窗口兼容。
            - **日历数据可靠、离线可用**：`ui/calendar-data.js` 由 `scripts/gen-calendar.py` 从 `chinese_calendar`（国务院历年放假安排映射）生成，覆盖 **2024–2027**；静态挂全局、`file://` 可跑、零运行时依赖。未覆盖年份优雅降级为周一~周五口径。

            ### 🔗 调整 · 项目与更新链接

            「项目与更新」主链接由仓库主页改指 **`releases/latest`**（最新发布页，直接带下载），版本号徽标仍保留仓库主页入口。

            ### 📌 本版仍包含 v0.7.0 / v0.7.1 的能力

            - 🔊 **语音报时**（默认关闭，可选声音与规则、中英文、免打扰）
            - 🚀 **Windows 开机自启修复**（官方 Builder 链注册 + 写入后回读校验）
            - 🆕 **一键更新** + 🛠️ **NSIS 更新卡死修复**（`FindProcess`/`KillProcess`）

            ### 📥 下载与安装

            | 平台 | 文件 |
            |---|---|
            | 🪟 Windows | `*.msi` 或 `*-setup.exe` |
            | 🍎 macOS Intel | `*x64.dmg` |
            | 🍎 macOS Apple Silicon | `*aarch64.dmg` |
            | 🐧 Debian / Ubuntu | `*.deb` |
            | 🐧 Fedora / RHEL | `*.rpm` |
            | 🐧 通用 Linux | `*.AppImage` |

            > ⚠️ 安装包未做代码签名：macOS 首次打开需右键→打开，Windows 可能弹 SmartScreen 点「仍要运行」。
            > 旧版本覆盖安装即可，配置（含窗口清单与位置）自动保留、自动迁移。

            ### ✅ 验证

            全套 10 套回归全部通过，合计 **437 项**（`verify_features.py` 由 43 增至 60：新增日历判定与自定义模式断言），无回归。

            完整版本记录见 [CHANGELOG.md](https://github.com/xiaoqiangclub/desk-clock/blob/main/CHANGELOG.md) · 项目介绍见 [README.md](https://github.com/xiaoqiangclub/desk-clock/blob/main/README.md) · 协议 MIT。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
