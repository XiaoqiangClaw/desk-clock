name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Publish ${{ matrix.platform }} ${{ matrix.args }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # 与 build.yml 共用同一脚本：预置 WiX/NSIS，避开 GitHub Release 临时 504。
      - name: Preinstall WiX/NSIS tooling
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/prepare-windows-tools.ps1

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install Tauri CLI (cargo, no npm frontend)
        run: cargo install tauri-cli --version '^2.0.0' --locked

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "."
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Desk Clock ${{ github.ref_name }} 🕐"
          releaseBody: |
            ## 🕐 Desk Clock v0.7.3

            好看、好用、还跨平台的开源桌面时钟 —— 透明悬浮在壁纸之上，无边框、无黑底。
            本次让**日历数据（含 A股交易日）自动更新**：已安装的旧版本无需重装/升级，也能自动拿到未来年份的正确日历。

            ### 🔄 新增 · 日历数据自动更新（构建期 + 运行时双层闭环）

            **先澄清一个概念**：A股交易日不是独立数据集，而是「周一~周五 且 非法定节假日」的**派生结果**；工作日 / 周末 / 法定节假日 / 交易日 四种重复规则共用同一份国务院放假 + 调休数据。真正会过期的是这份政策数据，它一更新，四种规则同时自动更新。它只能「自动跟随权威数据源」，无法凭空算出未来年份。

            - **① 构建期自动**：新增定时任务每周把 `chinese_calendar` 升到最新版并重跑生成器；生成器改为**自动探测库支持到的最新年份**并纳入，不再写死 2024–2027。国务院发布 2028 放假安排、上游升级后，仓库数据自动补齐 2028，无需手改年份常量。
            - **② 运行时静默同步**：已安装 v0.7.2 及更早版本的用户**不用重装**，启动后静默从本仓库拉取最新日历并热更新，四种规则（含交易日）即时生效。严格校验 + **只增不减防回退** + 离线/失败/超时一律无感回落到内置表，内置数据永远兜底。零新依赖、零新权限，数据源自托管、非第三方 API。
            - **可开关、默认开启**：设置 →「关于」页新增「📅 日历数据」卡片，显示当前覆盖年份与来源，可关闭自动更新（关闭后完全不联网）、可「立即检查」。默认开启——数据同步是静默、失败无感的正确性保障，与「会发声打扰、默认关闭」的语音播报性质不同。
            - **跨窗口一致**：同步结果同源共享，其它已打开窗口实时跟上。

            ### 📌 本版仍包含此前全部能力

            - 📅 **灵活闹钟重复规则**（v0.7.2）：每天 / 工作日（含调休）/ 周末 / 法定节假日 / A股交易日 / 自定义 / 一次性
            - 🔊 **语音报时**（默认关闭，可选声音与规则、中英文、免打扰）
            - 🚀 **Windows 开机自启修复**、🆕 **一键更新** + 🛠️ **NSIS 更新卡死修复**
            - 🔗「项目与更新」链接直指 `releases/latest`

            ### 📥 下载与安装

            | 平台 | 文件 |
            |---|---|
            | 🪟 Windows | `*.msi` 或 `*-setup.exe` |
            | 🍎 macOS Intel | `*x64.dmg` |
            | 🍎 macOS Apple Silicon | `*aarch64.dmg` |
            | 🐧 Debian / Ubuntu | `*.deb` |
            | 🐧 Fedora / RHEL | `*.rpm` |
            | 🐧 通用 Linux | `*.AppImage` |

            > ⚠️ 安装包未做代码签名：macOS 首次打开需右键→打开，Windows 可能弹 SmartScreen 点「仍要运行」。
            > 旧版本覆盖安装即可，配置（含窗口清单与位置）自动保留、自动迁移。覆盖安装后仍可关闭旧进程手工退出以避开旧卸载器边界。

            ### ✅ 验证

            全套 11 套回归全部通过，合计 **532 项**；新增 `verify_calendar_sync.py`（95 项，含 Node 行为测试：真实加载模块实测热替换、严格校验、防回退、缓存、节流与交易日判定随之更新），无回归。

            完整版本记录见 [CHANGELOG.md](https://github.com/xiaoqiangclub/desk-clock/blob/main/CHANGELOG.md) · 项目介绍见 [README.md](https://github.com/xiaoqiangclub/desk-clock/blob/main/README.md) · 协议 MIT。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
