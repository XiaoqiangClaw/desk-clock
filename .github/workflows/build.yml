name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".preview/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".preview/**"
  workflow_dispatch:

jobs:
  verify:
    name: Verify (Python / HTML)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Static checks
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/verify.py scripts/verify_features.py scripts/verify_v03.py scripts/verify_v04.py
          bash -n scripts/dev.sh scripts/build.sh scripts/preview.sh
          node --check ui/app.js
          node --check ui/prefs.js
          node --check ui/alarm.js
          node --check ui/clock.js
          node --check ui/i18n.js
          node --check ui/flip.js
          node --check ui/fonts.js
          python3 -c "import json; json.load(open('src-tauri/tauri.conf.json')); json.load(open('src-tauri/capabilities/default.json'))"
          test -f ui/index.html
          test -f src-tauri/tauri.conf.json
          test -f ui/assets/donate-wechat.jpg
          test -f ui/assets/donate-alipay.jpg
          echo "Static checks OK"

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # v0.4: Tauri 打 MSI/NSIS 时会从 GitHub Release 下载 WiX / NSIS 工具包，
      # runner 上偶发 504 会让整个 Windows job 在编译成功后仍判失败。
      # 这里用普通 GET（实测稳定）预下载并展开到 Tauri 期望的缓存目录，
      # 必需文件齐全时 bundler 直接复用、不再联网。带重试 + 哈希校验。
      - name: Preinstall WiX/NSIS tooling (avoid transient 504)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'tauri'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          function Get-File($url, $out, $minBytes) {
            for ($i = 1; $i -le 5; $i++) {
              try {
                Write-Host "GET $url (attempt $i)"
                Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing -TimeoutSec 300 `
                  -Headers @{ 'User-Agent' = 'DeskClock-CI' }
                if ((Get-Item $out).Length -ge $minBytes) { return $true }
              } catch { Write-Host "  failed: $_" }
              Start-Sleep -Seconds (4 * $i)
            }
            return $false
          }
          # --- WiX 3.14 (MSI) ---
          $wixDir = Join-Path $root 'WixTools314'
          $wixReq = @('candle.exe','candle.exe.config','darice.cub','light.exe','light.exe.config','wconsole.dll','winterop.dll','wix.dll','WixUIExtension.dll','WixUtilExtension.dll')
          $wixOk = Test-Path $wixDir
          if ($wixOk) { foreach ($f in $wixReq) { if (-not (Test-Path (Join-Path $wixDir $f))) { $wixOk = $false; break } } }
          if (-not $wixOk) {
            $zip = Join-Path $env:TEMP 'wix314.zip'
            if (-not (Get-File 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' $zip 1000000)) { throw 'WiX download failed' }
            Remove-Item -Recurse -Force $wixDir -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $wixDir | Out-Null
            Expand-Archive -Path $zip -DestinationPath $wixDir -Force
            foreach ($f in $wixReq) { if (-not (Test-Path (Join-Path $wixDir $f))) { throw "WiX missing: $f" } }
          }
          Write-Host 'WiX ready'
          # --- NSIS 3.13 (setup.exe) ---
          $nsisDir = Join-Path $root 'NSIS'
          $nsisReq = @('makensis.exe','Bin/makensis.exe','Stubs/lzma-x86-unicode','Stubs/lzma_solid-x86-unicode','Plugins/x86-unicode/additional/nsis_tauri_utils.dll','Include/MUI2.nsh','Include/FileFunc.nsh','Include/x64.nsh','Include/nsDialogs.nsh','Include/WinMessages.nsh','Include/Win/COM.nsh','Include/Win/Propkey.nsh','Include/Win/RestartManager.nsh')
          $nsisOk = Test-Path $nsisDir
          if ($nsisOk) { foreach ($f in $nsisReq) { if (-not (Test-Path (Join-Path $nsisDir $f))) { $nsisOk = $false; break } } }
          if (-not $nsisOk) {
            $nz = Join-Path $env:TEMP 'nsis-3.13.zip'
            if (-not (Get-File 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip' $nz 1000000)) { throw 'NSIS download failed' }
            Remove-Item -Recurse -Force (Join-Path $root 'nsis-3.13') -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force $nsisDir -ErrorAction SilentlyContinue
            Expand-Archive -Path $nz -DestinationPath $root -Force
            if (Test-Path (Join-Path $root 'nsis-3.13')) { Rename-Item -Path (Join-Path $root 'nsis-3.13') -NewName 'NSIS' }
            $plugin = Join-Path $nsisDir 'Plugins/x86-unicode/additional/nsis_tauri_utils.dll'
            if (-not (Test-Path $plugin)) {
              New-Item -ItemType Directory -Force -Path (Split-Path $plugin) | Out-Null
              if (-not (Get-File 'https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll' $plugin 30000)) { throw 'nsis_tauri_utils.dll download failed' }
            }
            foreach ($f in $nsisReq) { if (-not (Test-Path (Join-Path $nsisDir $f))) { throw "NSIS missing: $f" } }
          }
          Write-Host 'NSIS ready'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install Tauri CLI (cargo, no npm frontend)
        run: cargo install tauri-cli --version '^2.0.0' --locked

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "."
          tauriScript: cargo tauri
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "[platform]-[arch]-[bundle]"
