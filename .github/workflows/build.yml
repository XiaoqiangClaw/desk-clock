name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".preview/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".preview/**"
  workflow_dispatch:

jobs:
  verify:
    name: Verify (Python / HTML)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Static checks
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/verify.py scripts/verify_features.py scripts/verify_v03.py scripts/verify_v04.py scripts/verify_v05.py scripts/verify_v06.py scripts/verify_v061.py scripts/verify_v062.py scripts/verify_v063.py scripts/verify_v076.py scripts/verify_alert_layout.py scripts/verify_announce.py scripts/verify_calendar_sync.py scripts/gen-calendar.py
          bash -n scripts/dev.sh scripts/build.sh scripts/preview.sh
          node --check ui/app.js
          node --check ui/prefs.js
          node --check ui/alarm.js
          node --check ui/announce.js
          node --check ui/schedule.js
          node --check ui/calendar-data.js
          node --check ui/calendar-sync.js
          node --check ui/clock.js
          node --check ui/i18n.js
          node --check ui/flip.js
          node --check ui/fonts.js
          python3 -c "import json; json.load(open('src-tauri/tauri.conf.json')); json.load(open('src-tauri/capabilities/default.json')); json.load(open('ui/calendar-data.json'))"
          python3 - <<'PY'
          import json, re
          js = open('ui/calendar-data.js', encoding='utf-8').read()
          a = json.loads(re.search(r'CalendarData = (\{.*\});', js, re.S).group(1))
          b = json.load(open('ui/calendar-data.json', encoding='utf-8'))
          assert a == b, 'calendar-data.js and .json payload must be identical'
          print('calendar data (.js == .json) OK; coverage', a['coverage'])
          PY
          test -f ui/index.html
          test -f src-tauri/tauri.conf.json
          test -f ui/assets/donate-wechat.jpg
          test -f ui/assets/donate-alipay.jpg
          echo "Static checks OK"

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # 预置 WiX/NSIS 工具，避开 GitHub Release 临时 504（详见脚本头注释）。
      - name: Preinstall WiX/NSIS tooling
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/prepare-windows-tools.ps1

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install Tauri CLI (cargo, no npm frontend)
        run: cargo install tauri-cli --version '^2.0.0' --locked

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "."
          tauriScript: cargo tauri
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "[platform]-[arch]-[bundle]"
