[package]
name = "desk-clock"
version = "0.3.0"
description = "An open-source, low-footprint desktop clock"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "desk_clock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2"

# Windows-only: detect an elevated (administrator) process for the
# privilege prompt / auto-elevation feature.
[target.'cfg(target_os = "windows")'.dependencies]
is_elevated = "0.1"

[features]
# by default Tauri runs in production mode with the custom protocol
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
