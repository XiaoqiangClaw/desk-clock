[package]
name = "desk-clock"
version = "0.1.0"
description = "A private, low-footprint desktop clock"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "desk_clock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2"

[features]
# by default Tauri runs in production mode with the custom protocol
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
